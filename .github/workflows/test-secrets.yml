name: Test Secrets

on:
  workflow_dispatch:  # Запуск вручную

jobs:
  test:
    runs-on: ubuntu-latest
    environment: hip-host-2026-05
    steps:
      - name: Debug secrets
        run: |
          echo "=== Проверка секретов ==="
          
          if [ -n "${{ secrets.HOST }}" ]; then
            echo "✅ HOST: [SET] (${#HOST} characters)"
          else
            echo "❌ HOST: [NOT SET]"
          fi
          
          if [ -n "${{ secrets.USERNAME }}" ]; then
            echo "✅ USERNAME: [SET]"
          else
            echo "❌ USERNAME: [NOT SET]"
          fi
          
          if [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "✅ SSH_PRIVATE_KEY: [SET]"
          else
            echo "❌ SSH_PRIVATE_KEY: [NOT SET]"
          fi
      
      - name: Test connection with actual values
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== SUCCESS ==="
            echo "Hostname: $(hostname)"
            echo "Date: $(date)"
