name: Deploy to VPS

on:
  workflow_dispatch: # Manual trigger from the GitHub Actions UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: hip-host-2026-05
    steps:
      - name: Test SSH connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "✅ SSH connection OK"
            pwd
            whoami
            date

      # Deploy-time env: GitHub Environment Variables (`vars`) and Secrets (`secrets`) are forwarded over SSH via `envs`.
      # First deploy: clone uses `GIT_CLONE_URL` if set, else `git@github.com:${GITHUB_REPOSITORY}.git` (needs VPS SSH access to GitHub).
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Deploy / runner
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          RESTART_COMMAND: ${{ vars.RESTART_COMMAND }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GIT_CLONE_URL: ${{ vars.GIT_CLONE_URL }}
          # App: DB + Vite build
          DATABASE_URL: ${{ vars.DATABASE_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ vars.VITE_CLOUDINARY_CLOUD_NAME }}
          # App: Express runtime (photo upload signing — see backend/src/lib/cloudinaryUpload.ts)
          CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ vars.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ vars.CLOUDINARY_API_SECRET }}
          CLOUDINARY_UPLOAD_PRESET: ${{ vars.CLOUDINARY_UPLOAD_PRESET }}
          CLOUDINARY_UPLOAD_FOLDER: ${{ vars.CLOUDINARY_UPLOAD_FOLDER }}
          # App: Clerk (backend — see backend/.env.example, clerkAuth, webhooks)
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          envs: DEPLOY_PATH,RESTART_COMMAND,GITHUB_REPOSITORY,GIT_CLONE_URL,DATABASE_URL,VITE_CLERK_PUBLISHABLE_KEY,VITE_API_URL,VITE_CLOUDINARY_CLOUD_NAME,CLOUDINARY_CLOUD_NAME,CLOUDINARY_API_KEY,CLOUDINARY_API_SECRET,CLOUDINARY_UPLOAD_PRESET,CLOUDINARY_UPLOAD_FOLDER,CLERK_PUBLISHABLE_KEY,CLERK_SECRET_KEY,CLERK_WEBHOOK_SECRET
          script: |
            set -euo pipefail
            APP="${DEPLOY_PATH:-/apps/map-pins-26}"
            APP="${APP%/}"
            REPO_URL="${GIT_CLONE_URL:-git@github.com:${GITHUB_REPOSITORY}.git}"
            if [ ! -d "$APP/.git" ]; then
              if [ -e "$APP" ] && [ ! -d "$APP" ]; then
                echo "✖ $APP exists but is not a directory; fix DEPLOY_PATH." >&2
                exit 1
              fi
              if [ ! -e "$APP" ]; then
                mkdir -p "$APP"
                echo "📥 First deploy: cloning $REPO_URL → $APP"
                git clone "$REPO_URL" "$APP"
              elif [ -d "$APP" ] && [ -z "$(ls -A "$APP" 2>/dev/null || true)" ]; then
                echo "📥 First deploy: cloning $REPO_URL → $APP"
                git clone "$REPO_URL" "$APP"
              else
                echo "✖ $APP exists, is not empty, and has no .git (first clone needs an empty or new path)." >&2
                echo "   Often DEPLOY_PATH points at a parent (e.g. /apps) instead of the app leaf (e.g. /apps/map-pins-26)." >&2
                echo "   Contents:" >&2
                ls -la "$APP" >&2 || true
                exit 1
              fi
            fi
            cd "$APP"
            echo "📂 Deploy directory: $APP"
            git pull --ff-only
            corepack enable
            pnpm install --frozen-lockfile
            export NODE_ENV=production
            pnpm build
            pnpm --filter backend exec prisma migrate deploy
            if [ -n "${RESTART_COMMAND:-}" ]; then
              echo "🔄 RESTART_COMMAND"
              bash -lc "$RESTART_COMMAND"
            else
              echo "ℹ️ RESTART_COMMAND is unset — restart Node manually (e.g. PM2/systemd)."
            fi
            echo "✅ Deploy finished."
