name: Deploy to VPS

on:
  workflow_dispatch: # Manual trigger from the GitHub Actions UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: hip-host-2026-05
    steps:
      - name: Test SSH connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "✅ SSH connection OK"
            pwd
            whoami
            date

      # Deploy-time env: Variables and Secrets are forwarded over SSH (`envs`) — available to this shell (`pnpm`, Prisma).
      #
      # PM2: a plain `pm2 restart` replays env from when the process was FIRST started — it does NOT pull every key
      # from this session. If the server has no `.env` file and vars come only from this deploy (`envs` below),
      # RESTART_COMMAND **must** include `--update-env` (e.g. `pm2 reload map-pins-api --update-env`) so DATABASE_URL,
      # CLERK_*, FRONTEND_URL, Cloudinary, etc. are injected from the SSH session. Alternative: ecosystem `env:` / systemd `Environment=` on the VPS.
      #
      # First deploy: default clone URL uses `GIT_CLONE_URL` or `git@github.com:${GITHUB_REPOSITORY}.git`.
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Deploy / runner
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          RESTART_COMMAND: ${{ vars.RESTART_COMMAND }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GIT_CLONE_URL: ${{ vars.GIT_CLONE_URL }}
          # App: DB + Vite build
          DATABASE_URL: ${{ vars.DATABASE_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ vars.VITE_CLOUDINARY_CLOUD_NAME }}
          # Optional: `true` to enable `[clerk]` console logs in the built SPA (frontend/src/lib/clerkDebug.ts)
          VITE_DEBUG_CLERK: ${{ vars.VITE_DEBUG_CLERK }}
          # App: Express runtime (photo upload signing — see backend/src/lib/cloudinaryUpload.ts)
          CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ vars.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ vars.CLOUDINARY_API_SECRET }}
          CLOUDINARY_UPLOAD_PRESET: ${{ vars.CLOUDINARY_UPLOAD_PRESET }}
          CLOUDINARY_UPLOAD_FOLDER: ${{ vars.CLOUDINARY_UPLOAD_FOLDER }}
          # App: Clerk (backend — see backend/.env.example, clerkAuth, webhooks)
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ vars.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ vars.CLERK_WEBHOOK_SECRET }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          envs: DEPLOY_PATH,RESTART_COMMAND,GITHUB_REPOSITORY,GIT_CLONE_URL,DATABASE_URL,FRONTEND_URL,VITE_CLERK_PUBLISHABLE_KEY,VITE_API_URL,VITE_CLOUDINARY_CLOUD_NAME,VITE_DEBUG_CLERK,CLOUDINARY_CLOUD_NAME,CLOUDINARY_API_KEY,CLOUDINARY_API_SECRET,CLOUDINARY_UPLOAD_PRESET,CLOUDINARY_UPLOAD_FOLDER,CLERK_PUBLISHABLE_KEY,CLERK_SECRET_KEY,CLERK_WEBHOOK_SECRET
          script: |
            set -euo pipefail
            APP="${DEPLOY_PATH:-$HOME/apps/map-pins-26}"
            APP="${APP%/}"
            echo "📂 Using deploy path: $APP"
            REPO_URL="${GIT_CLONE_URL:-git@github.com:${GITHUB_REPOSITORY}.git}"
            if [ ! -d "$APP/.git" ]; then
              if [ -e "$APP" ] && [ ! -d "$APP" ]; then
                echo "✖ $APP exists but is not a directory; fix DEPLOY_PATH." >&2
                exit 1
              fi
              if [ ! -e "$APP" ]; then
                mkdir -p "$APP"
                echo "📥 First deploy: cloning $REPO_URL → $APP"
                git clone "$REPO_URL" "$APP"
              elif [ -d "$APP" ] && [ -z "$(ls -A "$APP" 2>/dev/null || true)" ]; then
                echo "📥 First deploy: cloning $REPO_URL → $APP"
                git clone "$REPO_URL" "$APP"
              else
                echo "✖ $APP exists, is not empty, and has no .git (first clone needs an empty or new path)." >&2
                echo "   Often DEPLOY_PATH points at a parent (e.g. ~/apps) instead of the app leaf (e.g. ~/apps/map-pins-26)." >&2
                echo "   Contents:" >&2
                ls -la "$APP" >&2 || true
                exit 1
              fi
            fi
            cd "$APP"
            echo "📂 Deploy directory: $APP"
            git pull --ff-only

            # Load nvm (non-interactive SSH does not read ~/.bashrc). Respect NVM_DIR if already set on the host.
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            if [ ! -s "$NVM_DIR/nvm.sh" ]; then
              echo "✖ nvm not found at $NVM_DIR/nvm.sh; install nvm or set NVM_DIR." >&2
              exit 1
            fi
            \. "$NVM_DIR/nvm.sh"
            # Pinned Node major for deploy (avoid cwd/.nvmrc); `install` is a no-op when already present.
            nvm install 24
            nvm use 24
            echo "🔍 node $(node -v) | npm $(npm -v) | pnpm $(command -v pnpm >/dev/null && pnpm -v || echo not yet)"
            if command -v corepack >/dev/null 2>&1; then
              corepack enable
            elif ! command -v pnpm >/dev/null 2>&1; then
              echo "✖ corepack and pnpm not found (exit 127). Install Node.js 24+ and ensure corepack is on PATH, or install pnpm (e.g. npm i -g pnpm)." >&2
              exit 1
            fi
            pnpm install --frozen-lockfile
            export NODE_ENV=production
            pnpm build
            pnpm --filter backend exec prisma migrate deploy
            if [ -n "${RESTART_COMMAND:-}" ]; then
              if ! command -v pm2 >/dev/null 2>&1; then
                echo "✖ pm2 not found on PATH after nvm (install e.g. npm i -g pm2 for this Node)." >&2
                exit 1
              fi
              echo "🔧 pm2 $(pm2 -v)"
              # Avoid `case`/`;;` here: ssh-action may join lines with `;` and break `case` syntax.
              if [ "${RESTART_COMMAND#*--update-env}" = "$RESTART_COMMAND" ]; then
                echo "⚠ RESTART_COMMAND has no --update-env — PM2 may keep an old env; add --update-env to reload Clerk/DB/FRONTEND_URL vars from this deploy." >&2
              fi
              echo "🔄 RESTART_COMMAND"
              export _DEPLOY_RESTART="$RESTART_COMMAND"
              bash -lc '
                export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
                [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
                nvm use 24
                eval "$_DEPLOY_RESTART"
              '
            else
              echo "ℹ️ RESTART_COMMAND is unset — restart Node manually (e.g. PM2/systemd)."
            fi
            echo "✅ Deploy finished."
